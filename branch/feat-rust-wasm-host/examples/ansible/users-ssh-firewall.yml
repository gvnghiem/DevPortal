---
# Server hardening: users, SSH configuration, firewall and a scheduled job.
- name: Harden servers
  hosts: all
  become: true
  vars:
    ssh_port: 22
    admins: [alice, bob]
  tasks:
    - name: Create the admin group
      ansible.builtin.group:
        name: admins
        state: present

    - name: Create admin users
      ansible.builtin.user:
        name: "{{ item }}"
        groups: admins,sudo
        append: true
        shell: /bin/bash
      loop: "{{ admins }}"

    - name: Install firewall and fail2ban
      ansible.builtin.apt:
        name: [ufw, fail2ban]
        state: present
        update_cache: true

    - name: Harden sshd_config
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?{{ item.key }}"
        line: "{{ item.key }} {{ item.value }}"
        create: true
      loop:
        - { key: PermitRootLogin, value: "no" }
        - { key: PasswordAuthentication, value: "no" }
        - { key: Port, value: "{{ ssh_port }}" }
      notify: Restart ssh

    - name: Allow SSH and HTTP through the firewall
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: [22, 80]

    - name: Enable the firewall
      community.general.ufw:
        state: enabled

    - name: Nightly log cleanup at 02:30
      ansible.builtin.cron:
        name: log cleanup
        minute: "30"
        hour: "2"
        job: "find /var/log -name '*.gz' -mtime +14 -delete"

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted

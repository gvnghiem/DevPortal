---
# Error handling: ignore_errors, failed_when, assert, and block / rescue / always.
- name: When things go wrong
  hosts: webservers
  become: true
  tasks:
    - name: A command that fails, but we do not care
      ansible.builtin.command: "false"
      ignore_errors: true

    - name: Fail only when the output says so (failed_when)
      ansible.builtin.command: echo "disk usage 91%"
      register: disk
      failed_when: "'9' in disk.stdout"
      ignore_errors: true

    - name: Assert something about the host
      ansible.builtin.assert:
        that:
          - ansible_processor_vcpus >= 2
          - inventory_hostname.startswith("web")
        success_msg: "Host looks good"

    - name: Try something risky, recover, always clean up
      block:
        - name: Install a package that does not exist
          ansible.builtin.apt:
            name: this-package-does-not-exist
            state: present

        - name: This is skipped because the block already failed
          ansible.builtin.debug:
            msg: "you should never see me"
      rescue:
        - name: Recover — install a package that does
          ansible.builtin.apt:
            name: htop
            state: present

        - name: Tell everyone what happened
          ansible.builtin.debug:
            msg: "Rescued on {{ inventory_hostname }}"
      always:
        - name: Always write an audit line
          ansible.builtin.lineinfile:
            path: /var/log/deploy.log
            line: "deploy attempt finished on {{ inventory_hostname }}"
            create: true

    - name: And now one real failure (stops this host)
      ansible.builtin.fail:
        msg: "Deliberate failure — check the PLAY RECAP below"

    - name: Never reached
      ansible.builtin.debug:
        msg: "unreachable code"

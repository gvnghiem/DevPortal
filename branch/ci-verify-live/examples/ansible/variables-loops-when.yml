---
# Variables, loops, conditionals, register — the core Ansible toolkit.
- name: Loops and conditionals
  hosts: all
  become: true
  vars:
    team:
      - { name: alice, groups: "sudo",   shell: /bin/bash }
      - { name: bob,   groups: "deploy", shell: /bin/bash }
      - { name: carol, groups: "deploy", shell: /usr/sbin/nologin }
    env: staging
  tasks:
    - name: Show some gathered facts
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ ansible_distribution }} {{ ansible_distribution_version }}, {{ ansible_processor_vcpus }} vCPUs, {{ ansible_memtotal_mb }} MB RAM"

    - name: Create the team accounts (a loop over a list of dicts)
      ansible.builtin.user:
        name: "{{ item.name }}"
        groups: "{{ item.groups }}"
        shell: "{{ item.shell }}"
        append: true
      loop: "{{ team }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Only on web servers — install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
      when: "'webservers' in group_names"

    - name: Only on database servers — install PostgreSQL
      ansible.builtin.apt:
        name: postgresql
        state: present
      when: "'dbservers' in group_names"

    - name: Check what is listening on the web port
      ansible.builtin.command: systemctl is-active nginx
      register: nginx_state
      changed_when: false
      failed_when: false

    - name: Report nginx state
      ansible.builtin.debug:
        msg: "nginx is {{ nginx_state.stdout | default('unknown') }} on {{ inventory_hostname }}"

    - name: Drop a marker file only when env is production
      ansible.builtin.file:
        path: /etc/PRODUCTION
        state: touch
      when: env == "production"

    - name: Count how many users we manage
      ansible.builtin.set_fact:
        managed: "{{ team | map(attribute='name') | list }}"

    - name: Summary
      ansible.builtin.debug:
        msg: "Managed users ({{ managed | length }}): {{ managed | join(', ') }}"

---
# Configure the web servers: install nginx, deploy a page, start the service.
# Run it twice — the second run reports "ok" instead of "changed" (idempotency!).
- name: Configure web servers
  hosts: webservers
  become: true
  vars:
    site_title: "DevPortal demo"
    packages:
      - nginx
      - curl
  tasks:
    - name: Install packages
      ansible.builtin.apt:
        name: "{{ packages }}"
        state: present
        update_cache: true

    - name: Deploy the landing page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <h1>{{ site_title }}</h1>
          <p>Served by {{ inventory_hostname }} ({{ ansible_default_ipv4.address }})</p>
        mode: "0644"
      notify: Reload nginx

    - name: Make sure nginx is running and enabled
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Wait for port 80
      ansible.builtin.wait_for:
        port: 80
        timeout: 10

    - name: Show where it runs
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} is serving on port {{ http_port }}"

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

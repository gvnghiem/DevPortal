---
# The simplest possible playbook: can we reach every host, and what do we know about them?
- name: Check connectivity and gather facts
  hosts: all
  tasks:
    - name: Ping
      ansible.builtin.ping:

    - name: Who are we?
      ansible.builtin.command: whoami
      register: me
      changed_when: false

    - name: Print a fact report
      ansible.builtin.debug:
        msg:
          - "host      : {{ inventory_hostname }} ({{ ansible_host }})"
          - "os        : {{ ansible_distribution }} {{ ansible_distribution_version }} / {{ ansible_kernel }}"
          - "cpus / ram: {{ ansible_processor_vcpus }} / {{ ansible_memtotal_mb }} MB"
          - "ssh user  : {{ me.stdout }}"
          - "groups    : {{ group_names | join(', ') }}"

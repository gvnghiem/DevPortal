name: Rust apps
# Tests the Rust apps natively, then proves they still compile to WebAssembly.
on:
  pull_request:
    paths: ["rust-apps/**", "tools/build-wasm.sh", ".github/workflows/rust-wasm.yml"]
  push:
    branches: [main]
    paths: ["rust-apps/**", "tools/build-wasm.sh"]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep build output outside the checkout   # (the runner context is not allowed in job-level env)
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target" >> "$GITHUB_ENV"
      - name: Fetch public CPU test ROMs (nestest) for the NES emulator tests
        run: |
          git clone --quiet --depth 1 https://github.com/christopherpow/nes-test-roms "$RUNNER_TEMP/nes-test-roms"
          echo "NES_TEST_ROMS=$RUNNER_TEMP/nes-test-roms" >> "$GITHUB_ENV"
      - name: cargo test (native)
        run: cargo test --locked --workspace
        working-directory: rust-apps
      - name: Build .wasm
        run: bash tools/build-wasm.sh "$RUNNER_TEMP/out"
      - name: Every wasm must start with the wasm magic bytes
        run: for f in "$RUNNER_TEMP"/out/apps/*.wasm; do head -c4 "$f" | xxd -p | grep -qx 0061736d || { echo "::error::$f is not wasm"; exit 1; }; done

name: Verify GitHub Pages deploy
# Runs after every Pages build. If the build failed, or the live site is missing a file or
# fails a smoke test, this workflow fails — GitHub then emails the repo owner.
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Pages build must have succeeded
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        run: |
          echo "::error::GitHub Pages build ${{ github.event.workflow_run.conclusion }}: ${{ github.event.workflow_run.html_url }}"
          exit 1
      - name: Wait for the live site and check every file
        if: github.event_name != 'push'
        run: |
          base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          sleep 20
          for f in "" terraform-sim.js terraform-ui.js langs-extra.js examples-gen.js shell-sim.js shell-ui.js ansible-sim.js ansible-ui.js jscpp.bundle.js examples/ansible/web-server.yml; do
            ok=0
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$base/$f?v=$GITHUB_SHA")
              [ "$code" = 200 ] && ok=1 && break; sleep 15
            done
            [ $ok = 1 ] || { echo "::error::$base/$f returned $code"; exit 1; }
            echo "OK $f"
          done
          curl -s "$base/" | grep -q 'id="langSel"' || { echo "::error::index.html is not the DevPortal page"; exit 1; }

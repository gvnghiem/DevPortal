<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevPortal · JavaScript Playground</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a21; --panel2:#1b2029; --line:#262c38; --text:#e6e9ef; --muted:#8a93a6;
    --accent:#6ea8fe; --accent2:#4f8cf0; --ok:#5fd38d; --warn:#f2c14e; --err:#ff6b6b;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  .brand{font-weight:700;letter-spacing:.2px}
  .brand span{color:var(--accent)}
  .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:2px 8px;border-radius:99px}
  .spacer{flex:1}
  select,button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
  button:hover,select:hover{border-color:#3a4254}
  button.primary{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:600}
  button.primary:hover{background:#6199f5}
  label.chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer}
  main{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
  @media (max-width:820px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
  .pane{display:flex;flex-direction:column;min-height:0;min-width:0}
  .pane + .pane{border-left:1px solid var(--line)}
  @media (max-width:820px){.pane + .pane{border-left:0;border-top:1px solid var(--line)}}
  .bar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;min-height:38px}
  .tab{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:6px 10px;color:var(--muted)}
  .tab.active{color:var(--text);border-bottom-color:var(--accent)}
  .badge{background:var(--err);color:#fff;border-radius:99px;font-size:10px;padding:0 6px;margin-left:4px;display:none}
  .editor{flex:1;display:flex;min-height:0;background:var(--bg);font-family:var(--mono);font-size:13px;line-height:20px}
  #gutter{width:44px;padding:10px 8px 10px 0;text-align:right;color:#4a5265;background:var(--panel);overflow:hidden;user-select:none;white-space:pre;border-right:1px solid var(--line)}
  #code{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:10px 12px;white-space:pre;overflow:auto;tab-size:2;caret-color:var(--accent)}
  .view{flex:1;min-height:0;position:relative}
  .view > *{position:absolute;inset:0}
  #frameWrap{background:#fff}
  #frameWrap iframe{width:100%;height:100%;border:0;background:#fff}
  #empty{display:flex;align-items:center;justify-content:center;color:#888;font-size:13px;background:#fff}
  #console{overflow:auto;background:var(--bg);font-family:var(--mono);font-size:12.5px;padding:6px 0}
  .ln{padding:3px 14px;border-bottom:1px solid #1a1f29;white-space:pre-wrap;word-break:break-word}
  .ln.warn{color:var(--warn);background:#2a2412}
  .ln.error{color:var(--err);background:#2b1717}
  .ln.info{color:var(--accent)}
  .ln.sys{color:var(--muted);font-style:italic}
  .hint{margin-left:auto;font-size:11px;color:var(--muted)}
  kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-family:var(--mono);font-size:11px}
</style>
</head>
<body>
<header>
  <div class="brand">Dev<span>Portal</span> <span style="color:var(--muted);font-weight:400">/ Playground</span></div>
  <span class="tag">JavaScript</span>
  <div class="spacer"></div>
  <select id="examples" aria-label="Load an example"></select>
  <label class="chk"><input type="checkbox" id="auto"> Auto-run</label>
  <button id="reset" title="Reset to example">Reset</button>
  <button id="stop">Stop</button>
  <button id="run" class="primary">▶ Run</button>
</header>
<main>
  <section class="pane">
    <div class="bar"><span>script.js</span><span class="hint"><kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>Enter</kbd> to run</span></div>
    <div class="editor">
      <div id="gutter">1</div>
      <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="JavaScript code"></textarea>
    </div>
  </section>
  <section class="pane">
    <div class="bar">
      <button class="tab active" data-tab="preview">Preview</button>
      <button class="tab" data-tab="console">Console<span class="badge" id="errBadge">0</span></button>
      <button class="tab" id="clear" style="margin-left:auto;font-size:12px">Clear console</button>
    </div>
    <div class="view">
      <div id="frameWrap"><div id="empty">Press Run to see your output here</div></div>
      <div id="console" style="display:none"></div>
    </div>
  </section>
</main>

<script>
(function(){
  const EXAMPLES = {
"Hello, console": `// console.log output appears in the Console tab.
const greet = name => \`Hello, \${name}!\`;
console.log(greet("DevPortal"));

const nums = [5, 3, 8, 1, 9, 2];
console.log("sorted:", [...nums].sort((a, b) => a - b));
console.table && console.log("sum:", nums.reduce((a, b) => a + b, 0));
console.log({ nested: { ok: true, list: [1, 2, 3] } });
console.warn("This is a warning");

// Output also drops into the page. Try it:
document.body.innerHTML = "<h2 style='font-family:system-ui;padding:20px'>Hello from the DOM 👋</h2>";
`,
"Canvas: bouncing balls": `// A <canvas id="canvas"> is provided (fills the preview).
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const balls = Array.from({ length: 25 }, () => ({
  x: Math.random() * canvas.width, y: Math.random() * canvas.height,
  vx: (Math.random() - .5) * 5, vy: (Math.random() - .5) * 5,
  r: 8 + Math.random() * 16, h: Math.random() * 360
}));

function frame() {
  ctx.fillStyle = "rgba(15,17,21,.25)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (const b of balls) {
    b.x += b.vx; b.y += b.vy;
    if (b.x < b.r || b.x > canvas.width - b.r) b.vx *= -1;
    if (b.y < b.r || b.y > canvas.height - b.r) b.vy *= -1;
    ctx.beginPath();
    ctx.fillStyle = \`hsl(\${b.h},80%,60%)\`;
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
  }
  requestAnimationFrame(frame);
}
frame();
`,
"Canvas: sine waves": `const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let t = 0;
function draw() {
  const { width: w, height: h } = canvas;
  ctx.fillStyle = "#0f1115"; ctx.fillRect(0, 0, w, h);
  for (let k = 0; k < 6; k++) {
    ctx.beginPath();
    ctx.strokeStyle = \`hsl(\${200 + k * 25},85%,\${55 + k * 3}%)\`;
    ctx.lineWidth = 2;
    for (let x = 0; x <= w; x += 3) {
      const y = h / 2 + Math.sin(x * 0.012 + t + k * 0.6) * (30 + k * 18) * Math.sin(t * 0.5 + k);
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  t += 0.03;
  requestAnimationFrame(draw);
}
draw();
`,
"DOM: interactive counter": `// Build UI with plain DOM code inside <div id="app">.
const app = document.getElementById("app");
app.style.cssText = "font-family:system-ui;padding:24px;text-align:center";
let count = 0;

const label = document.createElement("div");
label.style.cssText = "font-size:64px;font-weight:700;margin:16px";
const mk = (txt, fn) => {
  const b = document.createElement("button");
  b.textContent = txt;
  b.style.cssText = "font-size:20px;padding:8px 20px;margin:4px;border-radius:8px;border:1px solid #ccc;cursor:pointer";
  b.onclick = fn;
  return b;
};
const render = () => { label.textContent = count; console.log("count =", count); };
app.append(label, mk("−", () => { count--; render(); }), mk("Reset", () => { count = 0; render(); }), mk("+", () => { count++; render(); }));
render();
`,
"Visualize: bubble sort": `// Animated bar chart of a sorting algorithm.
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const N = 40;
const arr = Array.from({ length: N }, () => 10 + Math.random() * (canvas.height - 30));
let i = 0, j = 0, swaps = 0, done = false;

function draw() {
  ctx.fillStyle = "#0f1115"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const bw = canvas.width / N;
  arr.forEach((v, k) => {
    ctx.fillStyle = done ? "#5fd38d" : (k === j || k === j + 1) ? "#ff6b6b" : "#6ea8fe";
    ctx.fillRect(k * bw + 1, canvas.height - v, bw - 2, v);
  });
}
function step() {
  if (i < N - 1) {
    if (j < N - i - 1) {
      if (arr[j] > arr[j + 1]) { [arr[j], arr[j + 1]] = [arr[j + 1], arr[j]]; swaps++; }
      j++;
    } else { j = 0; i++; }
  } else if (!done) { done = true; console.log("Sorted in", swaps, "swaps"); }
  draw();
  if (!done) requestAnimationFrame(step);
}
step();
`,
"Mouse: particle trail": `const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const parts = [];
canvas.addEventListener("mousemove", e => {
  const r = canvas.getBoundingClientRect();
  for (let k = 0; k < 4; k++) parts.push({
    x: e.clientX - r.left, y: e.clientY - r.top,
    vx: (Math.random() - .5) * 3, vy: (Math.random() - .5) * 3 - 1,
    life: 1, h: (performance.now() / 8) % 360
  });
});
(function loop() {
  ctx.fillStyle = "rgba(15,17,21,.2)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (let k = parts.length - 1; k >= 0; k--) {
    const p = parts[k];
    p.x += p.vx; p.y += p.vy; p.life -= 0.015;
    if (p.life <= 0) { parts.splice(k, 1); continue; }
    ctx.fillStyle = \`hsla(\${p.h},90%,60%,\${p.life})\`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 4 * p.life + 1, 0, 6.283); ctx.fill();
  }
  requestAnimationFrame(loop);
})();
console.log("Move your mouse over the preview");
`,
"Async & errors": `// Promises, timers, and error reporting (with line numbers).
const wait = ms => new Promise(r => setTimeout(r, ms));
async function main() {
  console.log("start");
  for (let n = 1; n <= 3; n++) { await wait(400); console.log("tick", n); }
  console.info("about to fail...");
  await wait(300);
  null.boom();   // <- line 8: this throws
}
main();
`
  };

  const $ = id => document.getElementById(id);
  const code = $("code"), gutter = $("gutter"), consoleEl = $("console"),
        wrap = $("frameWrap"), badge = $("errBadge"), sel = $("examples");
  let errCount = 0, autoTimer = null, runId = 0, frame = null;

  // examples dropdown
  Object.keys(EXAMPLES).forEach(k => { const o = document.createElement("option"); o.textContent = k; sel.appendChild(o); });

  // safe storage
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
  };

  // editor
  function updateGutter(){
    const n = code.value.split("\n").length;
    let s = ""; for (let i = 1; i <= n; i++) s += i + "\n";
    gutter.textContent = s;
    gutter.scrollTop = code.scrollTop;
  }
  code.addEventListener("scroll", () => { gutter.scrollTop = code.scrollTop; });
  code.addEventListener("input", () => {
    updateGutter();
    store.set("devportal.js.code", code.value);
    if ($("auto").checked) { clearTimeout(autoTimer); autoTimer = setTimeout(run, 700); }
  });
  code.addEventListener("keydown", e => {
    if (e.key === "Tab") {
      e.preventDefault();
      const s = code.selectionStart, en = code.selectionEnd;
      code.value = code.value.slice(0, s) + "  " + code.value.slice(en);
      code.selectionStart = code.selectionEnd = s + 2;
      code.dispatchEvent(new Event("input"));
    } else if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault(); run();
    }
  });

  // tabs
  function showTab(name){
    document.querySelectorAll(".tab[data-tab]").forEach(t => t.classList.toggle("active", t.dataset.tab === name));
    wrap.style.display = name === "preview" ? "" : "none";
    consoleEl.style.display = name === "console" ? "" : "none";
  }
  document.querySelectorAll(".tab[data-tab]").forEach(t => t.onclick = () => showTab(t.dataset.tab));

  // console
  function addLine(level, text){
    const d = document.createElement("div");
    d.className = "ln " + level;
    d.textContent = text;
    consoleEl.appendChild(d);
    consoleEl.scrollTop = consoleEl.scrollHeight;
    if (level === "error") { errCount++; badge.textContent = errCount; badge.style.display = "inline"; }
  }
  function clearConsole(){ consoleEl.innerHTML = ""; errCount = 0; badge.style.display = "none"; }
  $("clear").onclick = clearConsole;

  // runner
  function buildDoc(userCode){
    const head = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%}body{background:#fff}
#canvas{display:block;width:100%;height:100%;background:#0f1115}
#app{position:absolute;inset:0;overflow:auto;pointer-events:none}#app>*{pointer-events:auto}
</style></head><body><canvas id="canvas"></canvas><div id="app"></div>
<script>
(function(){
  var id=${runId};
  function ser(v,seen){
    seen=seen||[];
    if(typeof v==="string")return v;
    if(typeof v==="function")return "ƒ "+(v.name||"anonymous")+"()";
    if(typeof v==="undefined")return "undefined";
    if(typeof v==="symbol"||typeof v==="bigint")return String(v);
    if(v instanceof Error)return v.stack||String(v);
    if(v&&typeof v==="object"){
      if(seen.indexOf(v)>-1)return "[Circular]";
      seen.push(v);
      try{
        if(Array.isArray(v))return "["+v.map(function(x){return typeof x==="string"?JSON.stringify(x):ser(x,seen)}).join(", ")+"]";
        var parts=Object.keys(v).map(function(k){var x=v[k];return k+": "+(typeof x==="string"?JSON.stringify(x):ser(x,seen))});
        return "{ "+parts.join(", ")+" }";
      }catch(e){return String(v)}
    }
    return String(v);
  }
  function send(level,args){parent.postMessage({devportal:true,id:id,level:level,text:args.map(function(a){return ser(a)}).join(" ")},"*")}
  ["log","info","warn","error","debug"].forEach(function(m){
    var lvl=m==="debug"?"log":m;
    console[m]=function(){send(lvl,[].slice.call(arguments))};
  });
  window.addEventListener("error",function(e){
    var line=e.lineno?(e.lineno-OFFSET):"?";
    send("error",[(e.message||"Error")+(e.lineno?"  (line "+line+")":"")]);
    return true;
  });
  window.addEventListener("unhandledrejection",function(e){send("error",["Unhandled promise rejection: "+ser(e.reason)])});
  window.canvas=document.getElementById("canvas");
  function fit(){canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight}
  fit();
})();
<\/script><script>
`;
    const offset = head.split("\n").length - 1;
    const safe = userCode.replace(/<\/script/gi, "<\\/script");
    return head.replace("OFFSET", offset) + safe + "\n<\/script></body></html>";
  }

  function stop(){
    if (frame) { frame.remove(); frame = null; }
    runId++;
  }
  function run(){
    clearTimeout(autoTimer);
    stop(); clearConsole();
    const empty = $("empty"); if (empty) empty.style.display = "none";
    frame = document.createElement("iframe");
    frame.setAttribute("sandbox", "allow-scripts");
    frame.srcdoc = buildDoc(code.value);
    wrap.appendChild(frame);
    addLine("sys", "▶ ran at " + new Date().toLocaleTimeString());
  }
  window.addEventListener("message", e => {
    const d = e.data;
    if (!d || !d.devportal || d.id !== runId) return;
    addLine(d.level, d.text);
    if (d.level === "error") showTab("console");
  });

  $("run").onclick = run;
  $("stop").onclick = () => { stop(); addLine("sys", "■ stopped"); };
  sel.onchange = () => { code.value = EXAMPLES[sel.value]; updateGutter(); store.set("devportal.js.code", code.value); run(); };
  $("reset").onclick = () => { code.value = EXAMPLES[sel.value]; updateGutter(); store.set("devportal.js.code", code.value); };

  // init
  const saved = store.get("devportal.js.code");
  code.value = saved || EXAMPLES["Canvas: bouncing balls"];
  if (!saved) sel.value = "Canvas: bouncing balls";
  updateGutter();
  run();
})();
</script>
</body>
</html>

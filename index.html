<style>
  /* ───────── Themes: every colour comes from these variables ───────── */
  :root, [data-theme="black"]{
    color-scheme:dark;
    --page:#0f1115; --panel:#161a21; --panel2:#1b2029; --line:#262c38;
    --text:#e6e9ef; --muted:#8a93a6; --accent:#6ea8fe; --accent2:#4f8cf0; --accent-text:#ffffff;
    --ok:#5fd38d; --warn:#f2c14e; --err:#ff6b6b;
    --editor:#0f1115; --gutter:#161a21; --pbg:#0f1115; --blur:0px; --glow:none;
    --font:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  [data-theme="dark"]{
    --page:#232834; --panel:#2a303d; --panel2:#323a49; --line:#404858;
    --text:#dfe3ec; --muted:#98a1b3; --accent:#8ab4f8; --accent2:#5b8def;
    --editor:#232834; --gutter:#2a303d; --pbg:#232834;
  }
  [data-theme="light"]{
    color-scheme:light;
    --page:#f4f6fa; --panel:#ffffff; --panel2:#eef1f6; --line:#d9dee8;
    --text:#1b2230; --muted:#667085; --accent:#2563eb; --accent2:#2563eb;
    --ok:#16a34a; --warn:#b7791f; --err:#dc2626;
    --editor:#ffffff; --gutter:#f4f6fa; --pbg:#ffffff;
  }
  [data-theme="matrix"]{
    --page:#000000; --panel:rgba(0,14,2,.74); --panel2:rgba(0,36,6,.82); --line:#0c4a18;
    --text:#39ff6a; --muted:#1fa23f; --accent:#00ff41; --accent2:#00cc33; --accent-text:#001a05;
    --ok:#00ff41; --warn:#d6ff3a; --err:#ff3b3b;
    --editor:rgba(0,10,2,.80); --gutter:rgba(0,20,4,.88); --pbg:#000a02; --blur:2px;
    --glow:0 0 14px rgba(0,255,65,.22);
    --font:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  [data-theme="jarvis"]{
    --page:radial-gradient(ellipse at 50% 40%,#04263d 0%,#020f1c 60%,#01070f 100%);
    --panel:rgba(4,30,52,.62); --panel2:rgba(8,48,78,.72); --line:rgba(0,229,255,.28);
    --text:#d4f6ff; --muted:#6fb6c9; --accent:#00e5ff; --accent2:#00b8d4; --accent-text:#00131a;
    --ok:#3dffb0; --warn:#ffd24a; --err:#ff5c7a;
    --editor:rgba(2,18,32,.70); --gutter:rgba(3,26,46,.82); --pbg:#020f1c; --blur:6px;
    --glow:0 0 16px rgba(0,229,255,.25);
  }
  [data-theme="heaven"]{
    color-scheme:light;
    --page:linear-gradient(165deg,#ffffff 0%,#fff8dc 55%,#ffeaa0 100%);
    --gold:linear-gradient(180deg,#fff2a6 0%,#ffd700 38%,#f0bd00 72%,#d4a000 100%);   /* 24k gold */
    --panel:var(--gold); --panel2:#ffffff; --line:#e0b000;
    --text:#2f2200; --muted:#7a5c00; --accent:#b8860b; --accent2:#d4a000; --accent-text:#ffd700;
    --ok:#2e8b57; --warn:#b87400; --err:#c0392b;
    --editor:rgba(255,255,255,.93); --gutter:#fff8dc; --pbg:#ffffff; --blur:8px;
    --glow:0 2px 16px rgba(255,200,0,.55);
    --font:Georgia,"Times New Roman",serif;
  }
  /* Heaven: gold chrome (menu bar, tab bars, borders, buttons), white work areas */
  [data-theme="heaven"] header{box-shadow:0 2px 16px rgba(255,200,0,.55),inset 0 1px 0 rgba(255,255,255,.7);border-bottom-color:#b8860b}
  [data-theme="heaven"] .bar{color:#5a4200;border-bottom-color:#b8860b;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
  [data-theme="heaven"] .brand .sub,[data-theme="heaven"] label.chk,[data-theme="heaven"] .hint,[data-theme="heaven"] .tab{color:#5a4200}
  [data-theme="heaven"] .tab.active{color:#2f2200;border-bottom-color:#2f2200}
  [data-theme="heaven"] .sep{background:rgba(90,66,0,.35)}
  [data-theme="heaven"] select,[data-theme="heaven"] button:not(.primary):not(.tab),[data-theme="heaven"] input.name{
    background:#fffdf0;border-color:#b8860b;color:#2f2200}
  [data-theme="heaven"] select:hover,[data-theme="heaven"] button:hover{border-color:#2f2200}
  [data-theme="heaven"] button.primary,[data-theme="heaven"] .seg button.on{background:linear-gradient(180deg,#4a3500,#241a00);border-color:#241a00;color:#ffd700;box-shadow:0 1px 6px rgba(80,55,0,.4)}
  [data-theme="heaven"] .seg{border-color:#b8860b;background:#fffdf0}
  [data-theme="heaven"] .seg button{color:#5a4200}
  [data-theme="heaven"] .brand .logo{border-color:#b8860b}
  [data-theme="heaven"] .pane + .pane{border-left-color:#b8860b}
  [data-theme="heaven"] #gutter{border-right-color:#e0b000;color:#a07c00}
  [data-theme="heaven"] .ln{border-bottom-color:#f3e2a0}
  [data-theme="heaven"] kbd{background:#fffdf0;border-color:#b8860b;color:#2f2200}
  [data-theme="heaven"] #toast{background:#fffdf0;border-color:#d4a000}

  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--page);background-attachment:fixed;color:var(--text);font:14px/1.45 var(--font);display:flex;flex-direction:column}
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:none}
  [data-theme="matrix"] #bg{opacity:.65}
  [data-theme="jarvis"] #bg{opacity:.9}
  header,main{position:relative;z-index:1}
  header{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;backdrop-filter:blur(var(--blur));box-shadow:var(--glow)}
  .brand{font-weight:700;letter-spacing:.2px;margin-right:4px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .logo{height:54px;width:auto;display:block;border-radius:8px;border:1px solid var(--line);box-shadow:var(--glow)}
  .brand .sub{color:var(--muted);font-weight:400}
  [data-theme="jarvis"] .brand .sub{text-transform:uppercase;letter-spacing:2px}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;border-radius:0;background:transparent;color:var(--muted);padding:6px 12px}
  .seg button.on{background:var(--accent2);color:var(--accent-text);font-weight:600}
  .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:2px 8px;border-radius:99px}
  .spacer{flex:1}
  .group{display:flex;gap:6px;align-items:center}
  select,button,input.name{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
  select option{background:var(--pbg);color:var(--text)}
  button:hover,select:hover{border-color:var(--accent)}
  button svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  button.primary{background:var(--accent2);border-color:var(--accent2);color:var(--accent-text);font-weight:600;box-shadow:var(--glow)}
  button.primary:hover{filter:brightness(1.12)}
  label.chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer}
  .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
  main{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
  @media (max-width:820px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
  .pane{display:flex;flex-direction:column;min-height:0;min-width:0}
  .pane + .pane{border-left:1px solid var(--line)}
  @media (max-width:820px){.pane + .pane{border-left:0;border-top:1px solid var(--line)}}
  .bar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;min-height:38px;backdrop-filter:blur(var(--blur))}
  input.name{padding:3px 8px;font-size:12px;width:230px;max-width:60%;cursor:text;font-family:ui-monospace,Menlo,Consolas,monospace}
  .tab{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:6px 10px;color:var(--muted)}
  .tab.active{color:var(--text);border-bottom-color:var(--accent)}
  .badge{background:var(--err);color:#fff;border-radius:99px;font-size:10px;padding:0 6px;margin-left:4px;display:none}
  .editor{flex:1;display:flex;min-height:0;background:var(--editor);backdrop-filter:blur(var(--blur));font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13px;line-height:20px;position:relative}
  .editor.drop::after{content:"Drop a .js or .py file to import";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--panel2);color:var(--accent);font:600 16px var(--font);border:2px dashed var(--accent);opacity:.94}
  #gutter{width:44px;padding:10px 8px 10px 0;text-align:right;color:var(--muted);opacity:.8;background:var(--gutter);overflow:hidden;user-select:none;white-space:pre;border-right:1px solid var(--line)}
  #code{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:10px 12px;white-space:pre;overflow:auto;tab-size:2;caret-color:var(--accent)}
  .view{flex:1;min-height:0;position:relative}
  .view > *{position:absolute;inset:0}
  #frameWrap{background:var(--pbg)}
  #frameWrap iframe{width:100%;height:100%;border:0;background:var(--pbg)}
  #empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
  #console{overflow:auto;background:var(--editor);backdrop-filter:blur(var(--blur));font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;padding:6px 0}
  .ln{padding:3px 14px;border-bottom:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
  .ln.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
  .ln.error{color:var(--err);background:color-mix(in srgb,var(--err) 12%,transparent)}
  .ln.info{color:var(--accent)}
  .ln.sys{color:var(--muted);font-style:italic}
  .hint{margin-left:auto;font-size:11px;color:var(--muted)}
  kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--panel2);color:var(--text);border:1px solid var(--accent);padding:8px 16px;border-radius:10px;opacity:0;transition:.25s;z-index:10;pointer-events:none;box-shadow:var(--glow);max-width:90vw}
  #toast.show{opacity:1;transform:translateX(-50%)}
  @media (max-width:1560px){.lbl{display:none}}
</style>
</head>

<script>
(function(){
  /* ───────── Examples ─────────
     Inside every example you get: a full-size <canvas id="canvas">, a <div id="app"> overlay,
     and a THEME object { bg, fg, muted, accent, accent2, ok, warn, err, fade(alpha) }
     that follows the selected portal theme. */
  const EXAMPLES = {

"Hello, console": String.raw`// console.log output appears in the Console tab.
const greet = name => "Hello, " + name + "!";
console.log(greet("DevPortal"));

const nums = [5, 3, 8, 1, 9, 2];
console.log("sorted:", [...nums].sort((a, b) => a - b));
console.log("sum:", nums.reduce((a, b) => a + b, 0));
console.log({ nested: { ok: true, list: [1, 2, 3] } });
console.warn("This is a warning");

// Output can also go into the page. THEME follows the portal theme.
document.body.innerHTML =
  "<h2 style='font-family:system-ui;padding:20px;color:" + THEME.accent + "'>Hello from the DOM 👋</h2>";
`,

"Async & errors": String.raw`// Promises, timers, and error reporting (with line numbers).
const wait = ms => new Promise(r => setTimeout(r, ms));
async function main() {
  console.log("start");
  for (let n = 1; n <= 3; n++) { await wait(400); console.log("tick", n); }
  console.info("about to fail...");
  await wait(300);
  null.boom();   // <- this throws
}
main();
`,

"Canvas: bouncing balls": String.raw`const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const balls = Array.from({ length: 25 }, () => ({
  x: Math.random() * canvas.width, y: Math.random() * canvas.height,
  vx: (Math.random() - .5) * 5, vy: (Math.random() - .5) * 5,
  r: 8 + Math.random() * 16, h: Math.random() * 360
}));

function frame() {
  ctx.fillStyle = THEME.fade(.25);              // translucent fill = motion trails
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (const b of balls) {
    b.x += b.vx; b.y += b.vy;
    if (b.x < b.r || b.x > canvas.width - b.r) b.vx *= -1;
    if (b.y < b.r || b.y > canvas.height - b.r) b.vy *= -1;
    ctx.beginPath();
    ctx.fillStyle = "hsl(" + b.h + ",80%,60%)";
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
  }
  requestAnimationFrame(frame);
}
frame();
`,

"Visualize: bubble sort": String.raw`// Animated bar chart of a sorting algorithm.
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const N = 40;
const arr = Array.from({ length: N }, () => 10 + Math.random() * (canvas.height - 30));
let i = 0, j = 0, swaps = 0, done = false;

function draw() {
  ctx.fillStyle = THEME.bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const bw = canvas.width / N;
  arr.forEach((v, k) => {
    ctx.fillStyle = done ? THEME.ok : (k === j || k === j + 1) ? THEME.err : THEME.accent;
    ctx.fillRect(k * bw + 1, canvas.height - v, bw - 2, v);
  });
}
function step() {
  if (i < N - 1) {
    if (j < N - i - 1) {
      if (arr[j] > arr[j + 1]) { [arr[j], arr[j + 1]] = [arr[j + 1], arr[j]]; swaps++; }
      j++;
    } else { j = 0; i++; }
  } else if (!done) { done = true; console.log("Sorted in", swaps, "swaps"); }
  draw();
  if (!done) requestAnimationFrame(step);
}
step();
`,

"Traffic flow: nodes & roads": String.raw`// Cars flow between intersections. Roads turn green → red as they congest.
// Click an intersection to close it and watch traffic reroute.
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

const nodes = [
  [.08,.18],[.34,.10],[.62,.20],[.92,.12],
  [.18,.52],[.45,.48],[.72,.55],[.92,.50],
  [.10,.88],[.38,.86],[.66,.90],[.92,.86]
].map((p, i) => ({ id: i, x: p[0] * W, y: p[1] * H, blocked: false }));

const roads = [[0,1],[1,2],[2,3],[0,4],[1,5],[2,6],[3,7],[4,5],[5,6],[6,7],[4,8],[5,9],[6,10],[7,11],[8,9],[9,10],[10,11]]
  .map(r => ({ a: nodes[r[0]], b: nodes[r[1]], load: 0 }));
roads.forEach(r => r.len = Math.hypot(r.a.x - r.b.x, r.a.y - r.b.y));
const adj = nodes.map(n => roads.filter(r => r.a === n || r.b === n));
const other = (road, node) => road.a === node ? road.b : road.a;

const cars = Array.from({ length: 120 }, () => {
  const road = roads[Math.random() * roads.length | 0];
  return { road, from: Math.random() < .5 ? road.a : road.b, t: Math.random() };
});
let passed = 0, perSec = 0;
setInterval(() => { perSec = passed; passed = 0; }, 1000);

function update() {
  roads.forEach(r => r.load = 0);
  cars.forEach(c => c.road.load++);
  for (const c of cars) {
    c.t += (2.4 / (1 + c.road.load * 0.35)) / c.road.len;   // busier road = slower
    if (c.t >= 1) {
      const node = other(c.road, c.from);
      let options = adj[node.id].filter(r => r !== c.road && !other(r, node).blocked);
      if (!options.length) options = [c.road];                // dead end: turn around
      c.road = options[Math.random() * options.length | 0];
      c.from = node; c.t = 0; passed++;
    }
  }
}

function draw() {
  ctx.fillStyle = THEME.bg; ctx.fillRect(0, 0, W, H);
  for (const r of roads) {
    const jam = Math.min(1, r.load / 8);
    ctx.strokeStyle = "hsl(" + (130 - jam * 130) + ",80%,50%)";
    ctx.lineWidth = 3 + jam * 6; ctx.globalAlpha = .55;
    ctx.beginPath(); ctx.moveTo(r.a.x, r.a.y); ctx.lineTo(r.b.x, r.b.y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const c of cars) {
    const to = other(c.road, c.from);
    ctx.fillStyle = THEME.fg;
    ctx.beginPath();
    ctx.arc(c.from.x + (to.x - c.from.x) * c.t, c.from.y + (to.y - c.from.y) * c.t, 2.6, 0, 6.283);
    ctx.fill();
  }
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.font = "bold 11px system-ui";
  for (const n of nodes) {
    ctx.fillStyle = THEME.bg; ctx.strokeStyle = n.blocked ? THEME.err : THEME.accent; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(n.x, n.y, 12, 0, 6.283); ctx.fill(); ctx.stroke();
    ctx.fillStyle = n.blocked ? THEME.err : THEME.fg;
    ctx.fillText(n.blocked ? "✕" : String.fromCharCode(65 + n.id), n.x, n.y + 1);
  }
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.font = "13px system-ui"; ctx.fillStyle = THEME.fg;
  ctx.fillText("Throughput: " + perSec + " intersections/s  ·  click a node to close it", 14, H - 12);
}

canvas.addEventListener("click", e => {
  const rc = canvas.getBoundingClientRect();
  const x = e.clientX - rc.left, y = e.clientY - rc.top;
  const n = nodes.find(n => Math.hypot(n.x - x, n.y - y) < 20);
  if (n) { n.blocked = !n.blocked; console.log("Intersection", String.fromCharCode(65 + n.id), n.blocked ? "closed" : "open"); }
});
(function loop() { update(); draw(); requestAnimationFrame(loop); })();
`,

"World map: live connections": String.raw`// Stylised world map (rough hand-drawn continents, equirectangular projection)
// with animated connections between cities.
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const s = Math.min(W / 360, H / 180), ox = (W - 360 * s) / 2, oy = (H - 180 * s) / 2;
const P = (lon, lat) => [ox + (lon + 180) * s, oy + (90 - lat) * s];

const land = [
  // North America
  [[-168,66],[-156,71],[-125,70],[-95,72],[-82,69],[-64,60],[-56,52],[-66,44],[-76,36],[-81,25],[-90,29],[-97,26],[-97,20],[-88,16],[-83,9],[-78,8],[-86,14],[-95,16],[-105,20],[-110,24],[-115,31],[-118,34],[-124,40],[-124,48],[-135,57],[-150,60],[-165,60]],
  // Greenland
  [[-55,60],[-45,60],[-20,70],[-20,82],[-60,82],[-72,76],[-55,68]],
  // South America
  [[-78,8],[-72,12],[-62,10],[-50,0],[-35,-5],[-39,-15],[-48,-26],[-58,-38],[-65,-42],[-68,-52],[-74,-50],[-73,-37],[-71,-18],[-81,-5],[-80,0]],
  // Europe + Asia
  [[-10,36],[-9,43],[-2,48],[2,51],[8,55],[10,59],[5,62],[15,69],[30,71],[60,69],[80,73],[105,77],[140,72],[170,70],[180,66],[160,60],[155,52],[142,46],[135,35],[128,38],[122,40],[122,30],[110,20],[105,10],[100,4],[104,1],[98,8],[93,20],[80,15],[77,8],[72,20],[67,25],[57,25],[50,30],[44,36],[36,35],[28,37],[24,38],[16,40],[12,44],[8,44],[3,43],[-5,36]],
  // Africa
  [[-17,21],[-6,36],[10,37],[32,31],[34,28],[43,12],[51,12],[40,-3],[40,-15],[33,-26],[20,-35],[15,-26],[12,-6],[9,4],[-8,4],[-17,14]],
  // Australia
  [[114,-22],[122,-18],[131,-12],[142,-11],[146,-19],[153,-27],[150,-37],[140,-38],[131,-31],[115,-34]],
  // Japan
  [[130,31],[135,34],[141,38],[142,45],[138,37]]
];
const cities = [["New York",-74,40.7],["San Francisco",-122.4,37.8],["São Paulo",-46.6,-23.5],["London",-0.1,51.5],
  ["Cape Town",18.4,-33.9],["Mumbai",72.9,19.1],["Singapore",103.8,1.35],["Tokyo",139.7,35.7],["Sydney",151.2,-33.9],["Dubai",55.3,25.2]];

const arcs = [], ripples = [];
setInterval(() => {
  const a = cities[Math.random() * cities.length | 0];
  let b; do { b = cities[Math.random() * cities.length | 0]; } while (b === a);
  arcs.push({ a: P(a[1], a[2]), b: P(b[1], b[2]), t: 0 });
}, 450);

function pt(arc, t) {   // point on a quadratic curve that bows upward
  const mx = (arc.a[0] + arc.b[0]) / 2, my = (arc.a[1] + arc.b[1]) / 2 - Math.hypot(arc.b[0] - arc.a[0], arc.b[1] - arc.a[1]) * .25;
  const u = 1 - t;
  return [u * u * arc.a[0] + 2 * u * t * mx + t * t * arc.b[0], u * u * arc.a[1] + 2 * u * t * my + t * t * arc.b[1]];
}

function draw() {
  ctx.fillStyle = THEME.bg; ctx.fillRect(0, 0, W, H);
  // graticule
  ctx.strokeStyle = THEME.muted; ctx.globalAlpha = .18; ctx.lineWidth = 1;
  for (let lon = -180; lon <= 180; lon += 30) { const [x] = P(lon, 0); ctx.beginPath(); ctx.moveTo(x, oy); ctx.lineTo(x, oy + 180 * s); ctx.stroke(); }
  for (let lat = -90; lat <= 90; lat += 30) { const [, y] = P(0, lat); ctx.beginPath(); ctx.moveTo(ox, y); ctx.lineTo(ox + 360 * s, y); ctx.stroke(); }
  // land
  for (const poly of land) {
    ctx.beginPath();
    poly.forEach((p, i) => { const [x, y] = P(p[0], p[1]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.closePath();
    ctx.globalAlpha = .2; ctx.fillStyle = THEME.accent; ctx.fill();
    ctx.globalAlpha = .8; ctx.strokeStyle = THEME.accent; ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // arcs
  for (let i = arcs.length - 1; i >= 0; i--) {
    const arc = arcs[i]; arc.t += .014;
    ctx.beginPath(); ctx.strokeStyle = THEME.accent2; ctx.lineWidth = 1.5; ctx.globalAlpha = .7;
    for (let k = 0; k <= 30; k++) { const p = pt(arc, Math.min(arc.t, 1) * k / 30); k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }
    ctx.stroke(); ctx.globalAlpha = 1;
    const h = pt(arc, Math.min(arc.t, 1));
    ctx.fillStyle = THEME.fg; ctx.beginPath(); ctx.arc(h[0], h[1], 2.5, 0, 6.283); ctx.fill();
    if (arc.t >= 1) { ripples.push({ x: arc.b[0], y: arc.b[1], r: 0 }); arcs.splice(i, 1); }
  }
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i]; r.r += .6;
    if (r.r > 18) { ripples.splice(i, 1); continue; }
    ctx.strokeStyle = THEME.ok; ctx.globalAlpha = 1 - r.r / 18; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 6.283); ctx.stroke(); ctx.globalAlpha = 1;
  }
  // cities
  ctx.font = "11px system-ui"; ctx.textAlign = "left";
  for (const c of cities) {
    const [x, y] = P(c[1], c[2]);
    ctx.fillStyle = THEME.warn; ctx.beginPath(); ctx.arc(x, y, 3.5, 0, 6.283); ctx.fill();
    ctx.fillStyle = THEME.fg; ctx.fillText(c[0], x + 7, y + 4);
  }
  requestAnimationFrame(draw);
}
draw();
`,

"Charts: live trend": String.raw`// Streaming price chart: line + area, 10-point moving average, volume bars, hover crosshair.
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const N = 90;
let price = 100;
const next = () => {
  const open = price;
  price = Math.max(5, price + (Math.random() - .48) * 2.2);
  return { p: price, v: 20 + Math.random() * 80, up: price >= open };
};
const data = Array.from({ length: N }, next);
setInterval(() => { data.push(next()); data.shift(); }, 300);

const pad = { l: 56, r: 16, t: 52, b: 26 };
let mouse = null;
canvas.addEventListener("mousemove", e => { const r = canvas.getBoundingClientRect(); mouse = { x: e.clientX - r.left }; });
canvas.addEventListener("mouseleave", () => mouse = null);

function sma(k) {
  return data.map((_, i) => i < k - 1 ? null : data.slice(i - k + 1, i + 1).reduce((a, d) => a + d.p, 0) / k);
}

function draw() {
  ctx.fillStyle = THEME.bg; ctx.fillRect(0, 0, W, H);
  const cw = W - pad.l - pad.r;
  const priceH = (H - pad.t - pad.b) * .68;
  const volTop = pad.t + priceH + 12, volH = H - pad.b - volTop;
  const ps = data.map(d => d.p);
  const lo = Math.min(...ps) - 1, hi = Math.max(...ps) + 1;
  const X = i => pad.l + i / (N - 1) * cw;
  const Y = p => pad.t + (1 - (p - lo) / (hi - lo)) * priceH;

  // grid + y labels
  ctx.font = "11px system-ui"; ctx.textAlign = "right"; ctx.lineWidth = 1;
  for (let k = 0; k <= 4; k++) {
    const p = lo + (hi - lo) * k / 4, y = Y(p);
    ctx.strokeStyle = THEME.muted; ctx.globalAlpha = .25;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
    ctx.globalAlpha = 1; ctx.fillStyle = THEME.muted; ctx.fillText(p.toFixed(1), pad.l - 8, y + 4);
  }

  // area under the line
  const g = ctx.createLinearGradient(0, pad.t, 0, pad.t + priceH);
  g.addColorStop(0, THEME.accent + "66"); g.addColorStop(1, THEME.accent + "00");
  ctx.beginPath(); ctx.moveTo(X(0), pad.t + priceH);
  data.forEach((d, i) => ctx.lineTo(X(i), Y(d.p)));
  ctx.lineTo(X(N - 1), pad.t + priceH); ctx.closePath(); ctx.fillStyle = g; ctx.fill();

  // price line
  ctx.beginPath(); ctx.strokeStyle = THEME.accent; ctx.lineWidth = 2;
  data.forEach((d, i) => i ? ctx.lineTo(X(i), Y(d.p)) : ctx.moveTo(X(i), Y(d.p)));
  ctx.stroke();

  // moving average
  ctx.beginPath(); ctx.strokeStyle = THEME.warn; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
  let started = false;
  sma(10).forEach((v, i) => { if (v == null) return; started ? ctx.lineTo(X(i), Y(v)) : ctx.moveTo(X(i), Y(v)); started = true; });
  ctx.stroke(); ctx.setLineDash([]);

  // volume
  const bw = cw / N;
  data.forEach((d, i) => {
    ctx.fillStyle = d.up ? THEME.ok : THEME.err; ctx.globalAlpha = .75;
    const h = d.v / 100 * volH; ctx.fillRect(X(i) - bw / 2 + 1, volTop + volH - h, bw - 2, h);
  });
  ctx.globalAlpha = 1;

  // title + delta
  const last = ps[N - 1], first = ps[0], pct = (last - first) / first * 100;
  ctx.textAlign = "left"; ctx.fillStyle = THEME.fg; ctx.font = "bold 20px system-ui";
  ctx.fillText("ACME  " + last.toFixed(2), pad.l, 30);
  ctx.fillStyle = pct >= 0 ? THEME.ok : THEME.err; ctx.font = "bold 14px system-ui";
  ctx.fillText((pct >= 0 ? "▲ +" : "▼ ") + pct.toFixed(2) + "%", pad.l + 140, 30);
  ctx.fillStyle = THEME.muted; ctx.font = "11px system-ui";
  ctx.fillText("— price    - - 10-pt moving average", W - 250, 30);

  // crosshair
  if (mouse && mouse.x > pad.l && mouse.x < W - pad.r) {
    const i = Math.max(0, Math.min(N - 1, Math.round((mouse.x - pad.l) / cw * (N - 1))));
    ctx.strokeStyle = THEME.fg; ctx.globalAlpha = .5; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(X(i), pad.t); ctx.lineTo(X(i), H - pad.b); ctx.stroke(); ctx.globalAlpha = 1;
    ctx.fillStyle = THEME.accent; ctx.beginPath(); ctx.arc(X(i), Y(data[i].p), 4, 0, 6.283); ctx.fill();
    const label = data[i].p.toFixed(2);
    const bx = Math.min(X(i) + 8, W - 70);
    ctx.fillStyle = THEME.fg; ctx.fillRect(bx, Y(data[i].p) - 22, 60, 20);
    ctx.fillStyle = THEME.bg; ctx.font = "bold 12px system-ui"; ctx.fillText(label, bx + 8, Y(data[i].p) - 8);
  }
  requestAnimationFrame(draw);
}
draw();
`,

"Charts: bar race": String.raw`// Animated horizontal bar chart that re-ranks as values change.
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const items = ["Python","JavaScript","TypeScript","Go","Rust","Java","C#","Kotlin"].map((name, i) => ({
  name, value: 30 + Math.random() * 60, shown: 0, y: i * 40, hue: i * 43
}));
setInterval(() => items.forEach(it => it.value = Math.max(5, it.value + (Math.random() - .45) * 14)), 700);

function draw() {
  ctx.fillStyle = THEME.bg; ctx.fillRect(0, 0, W, H);
  const sorted = [...items].sort((a, b) => b.value - a.value);
  const max = Math.max(...items.map(i => i.value));
  const rowH = Math.min(46, (H - 50) / items.length);
  ctx.font = "bold 16px system-ui"; ctx.fillStyle = THEME.fg; ctx.textAlign = "left";
  ctx.fillText("Popularity index (simulated)", 20, 28);
  sorted.forEach((it, rank) => {
    it.y += (50 + rank * rowH - it.y) * .12;          // glide to new rank
    it.shown += (it.value - it.shown) * .12;           // ease the bar length
    const w = (W - 190) * it.shown / max;
    ctx.fillStyle = "hsl(" + it.hue + ",75%,55%)";
    ctx.fillRect(110, it.y, w, rowH - 8);
    ctx.fillStyle = THEME.fg; ctx.font = "13px system-ui"; ctx.textAlign = "right";
    ctx.fillText(it.name, 100, it.y + rowH / 2 + 1);
    ctx.textAlign = "left"; ctx.fillText(it.shown.toFixed(0), 116 + w, it.y + rowH / 2 + 1);
  });
  requestAnimationFrame(draw);
}
draw();
`,

"Algorithms & timing": String.raw`# Pure-Python algorithms with timing. Output goes to the Console tab.
import time
from functools import lru_cache

def sieve(n):
    flags = [True] * (n + 1)
    flags[0] = flags[1] = False
    for i in range(2, int(n ** 0.5) + 1):
        if flags[i]:
            for j in range(i * i, n + 1, i):
                flags[j] = False
    return [i for i, f in enumerate(flags) if f]

def is_prime(n):
    if n < 2:
        return False
    i = 2
    while i * i <= n:
        if n % i == 0:
            return False
        i += 1
    return True

def timed(label, fn, *args):
    t0 = time.perf_counter()
    out = fn(*args)
    print(f"{label:<26}{(time.perf_counter() - t0) * 1000:9.2f} ms")
    return out

N = 100_000
a = timed("sieve of Eratosthenes", sieve, N)
b = timed("trial division", lambda n: [i for i in range(n + 1) if is_prime(i)], N)
print("primes found:", len(a), "| same result:", a == b)

@lru_cache(maxsize=None)
def fib(n):
    return n if n < 2 else fib(n - 1) + fib(n - 2)

print("fib(90) =", fib(90))

"Canvas: particles": String.raw`# Draw on the canvas from Python through the JS bridge. Move the mouse to push the particles.
import math, random
from pyodide.ffi import create_proxy
from js import requestAnimationFrame

ctx = canvas.getContext("2d")
W, H = canvas.width, canvas.height
parts = [dict(x=random.uniform(0, W), y=random.uniform(0, H),
              vx=random.uniform(-1, 1), vy=random.uniform(-1, 1)) for _ in range(70)]
mouse = dict(x=-999, y=-999)

def on_move(e):
    r = canvas.getBoundingClientRect()
    mouse["x"], mouse["y"] = e.clientX - r.left, e.clientY - r.top
canvas.addEventListener("mousemove", create_proxy(on_move))

def frame(_t=None):
    ctx.fillStyle = THEME.fade(0.2)
    ctx.fillRect(0, 0, W, H)
    for p in parts:
        dx, dy = p["x"] - mouse["x"], p["y"] - mouse["y"]
        d = math.hypot(dx, dy)
        if d < 90:
            p["vx"] += dx / (d + 1) * 0.35
            p["vy"] += dy / (d + 1) * 0.35
        p["vx"] *= 0.99
        p["vy"] *= 0.99
        p["x"] = (p["x"] + p["vx"]) % W
        p["y"] = (p["y"] + p["vy"]) % H
    ctx.lineWidth = 1
    ctx.strokeStyle = THEME.accent2
    for i, a in enumerate(parts):
        for b in parts[i + 1:]:
            d = math.hypot(a["x"] - b["x"], a["y"] - b["y"])
            if d < 80:
                ctx.globalAlpha = 1 - d / 80
                ctx.beginPath()
                ctx.moveTo(a["x"], a["y"])
                ctx.lineTo(b["x"], b["y"])
                ctx.stroke()
    ctx.globalAlpha = 1
    ctx.fillStyle = THEME.accent
    for p in parts:
        ctx.beginPath()
        ctx.arc(p["x"], p["y"], 2.5, 0, 6.283)
        ctx.fill()
    requestAnimationFrame(proxy)

proxy = create_proxy(frame)
frame()
print("Move your mouse over the preview")
`,

    consoleEl.style.display = name === "console" ? "" : "none";
  }
  document.querySelectorAll(".tab[data-tab]").forEach(t => t.onclick = () => showTab(t.dataset.tab));
  function addLine(level, text){
    const d = document.createElement("div");
    d.className = "ln " + level; d.textContent = text;
    consoleEl.appendChild(d); consoleEl.scrollTop = consoleEl.scrollHeight;
    if (level === "error") { errCount++; badge.textContent = errCount; badge.style.display = "inline"; }
  }
  function clearConsole(){ consoleEl.innerHTML = ""; errCount = 0; badge.style.display = "none"; }
  $("clear").onclick = clearConsole;

  /* ───────── Runner (sandboxed iframes) ───────── */
  function readTheme(){
    const cs = getComputedStyle(document.documentElement), g = n => cs.getPropertyValue(n).trim();
    return { name: document.documentElement.dataset.theme, bg: g("--pbg"), fg: g("--text"), muted: g("--muted"),
             accent: g("--accent"), accent2: g("--accent2"), ok: g("--ok"), warn: g("--warn"), err: g("--err") };
  }
  function buildDoc(userCode, theme){
    const head = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;background:${theme.bg};color:${theme.fg};font-family:system-ui,sans-serif}
#canvas{display:block;width:100%;height:100%}
#app{position:absolute;inset:0;overflow:auto;pointer-events:none}#app>*{pointer-events:auto}
</style></head><body><canvas id="canvas"></canvas><div id="app"></div>
<script>
(function(){
  var id=${runId};
  var T=window.THEME=${JSON.stringify(theme)};
  (function(){var h=T.bg.replace("#","");T.rgb=[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];
    T.fade=function(a){return "rgba("+T.rgb.join(",")+","+a+")"}})();
  function ser(v,seen){
    seen=seen||[];
    if(typeof v==="string")return v;
    if(typeof v==="function")return "ƒ "+(v.name||"anonymous")+"()";
    if(typeof v==="undefined")return "undefined";
    if(typeof v==="symbol"||typeof v==="bigint")return String(v);
    if(v instanceof Error)return v.stack||String(v);
    if(v&&typeof v==="object"){
      if(seen.indexOf(v)>-1)return "[Circular]";
      seen.push(v);
      try{
        if(Array.isArray(v))return "["+v.map(function(x){return typeof x==="string"?JSON.stringify(x):ser(x,seen)}).join(", ")+"]";
        var parts=Object.keys(v).map(function(k){var x=v[k];return k+": "+(typeof x==="string"?JSON.stringify(x):ser(x,seen))});
        return "{ "+parts.join(", ")+" }";
      }catch(e){return String(v)}
    }
    return String(v);
  }
  function send(level,args){parent.postMessage({devportal:true,id:id,level:level,text:args.map(function(a){return ser(a)}).join(" ")},"*")}
  ["log","info","warn","error","debug"].forEach(function(m){
    var lvl=m==="debug"?"log":m;
    console[m]=function(){send(lvl,[].slice.call(arguments))};
  });
  window.addEventListener("error",function(e){
    var line=e.lineno?(e.lineno-OFFSET):"?";
    send("error",[(e.message||"Error")+(e.lineno?"  (line "+line+")":"")]);
    return true;
  });
  window.addEventListener("unhandledrejection",function(e){send("error",["Unhandled promise rejection: "+ser(e.reason)])});
  window.canvas=document.getElementById("canvas");
  canvas.width=canvas.clientWidth||innerWidth||640;canvas.height=canvas.clientHeight||innerHeight||400;
})();
<\/script><script>
`;
    const offset = head.split("\n").length - 1;
    const safe = userCode.replace(/<\/script/gi, "<\\/script");
    return head.replace("OFFSET", offset) + safe + "\n<\/script></body></html>";
  }
  /* ----- Python: one persistent sandboxed iframe running Pyodide ----- */
  const PYODIDE_VERSIONS = ["0.29.5", "0.27.7"];   // tried in order
  function buildPyDoc(theme){
    const js = PY_RUNTIME.replace("__VERS__", () => JSON.stringify(PYODIDE_VERSIONS))
                         .replace("__PRELUDE__", () => JSON.stringify(PY_PRELUDE));
    return '<!DOCTYPE html><html><head><meta charset="utf-8"><style>' +
      'html,body{margin:0;height:100%;background:' + theme.bg + ';color:' + theme.fg + ';font-family:system-ui,sans-serif}' +
      '#canvas{display:block;width:100%;height:100%}' +
      '#app{position:absolute;inset:0;overflow:auto;padding:8px}#app:empty{display:none}' +
      '#status{position:absolute;left:0;right:0;bottom:0;padding:8px 14px;font-size:12px;background:rgba(0,0,0,.55);color:#fff;pointer-events:none}' +
      '</style></head><body><canvas id="canvas"></canvas><div id="app"></div><div id="status">Starting Python…</div>' +
      '<script>' + js + '<\/script></body></html>';
  }
  function ensurePyFrame(){
    if (pyFrame) return;
    pyBooted = false;
    pyFrame = document.createElement("iframe");
    pyFrame.setAttribute("sandbox", "allow-scripts allow-popups");
    wrap.appendChild(pyFrame);
    void pyFrame.offsetWidth;
    pyFrame.srcdoc = buildPyDoc(readTheme());
  }
  function runPython(){
    if (jsFrame) { jsFrame.remove(); jsFrame = null; }
    ensurePyFrame();
    pyFrame.style.display = "";
    const msg = { devportalRun: true, id: ++runId, code: code.value, theme: readTheme() };
    if (pyBooted) pyFrame.contentWindow.postMessage(msg, "*"); else pyPending = msg;
    running = true;
    addLine("sys", "▶ ran at " + new Date().toLocaleTimeString());
  }
  function stopPython(){ if (pyFrame) { pyFrame.remove(); pyFrame = null; } pyBooted = false; pyPending = null; runId++; running = false; }

  /* ----- JavaScript ----- */
  function stopJs(){ if (jsFrame) { jsFrame.remove(); jsFrame = null; } runId++; running = false; }
  function runJs(){
    stopJs();
    if (pyFrame) pyFrame.style.display = "none";
    jsFrame = document.createElement("iframe");
    jsFrame.setAttribute("sandbox", "allow-scripts allow-popups");
    jsFrame.setAttribute("allow", "fullscreen; autoplay; encrypted-media; picture-in-picture");
    jsFrame.setAttribute("allowfullscreen", "");
    wrap.appendChild(jsFrame);
    void jsFrame.offsetWidth;                      // force layout so the canvas gets a real size
    jsFrame.srcdoc = buildDoc(code.value, readTheme());
    running = true;
    addLine("sys", "▶ ran at " + new Date().toLocaleTimeString());
  }

  function run(){
    clearTimeout(autoTimer);
    clearConsole(); showTab("preview");
    const empty = $("empty"); if (empty) empty.style.display = "none";
    if (lang === "python") runPython(); else runJs();
  }
  window.addEventListener("message", e => {
    const d = e.data;
    if (!d || !d.devportal) return;
    if (d.kind === "boot") {
      if (pyFrame && e.source === pyFrame.contentWindow) {
        pyBooted = true;
        if (pyPending) { pyFrame.contentWindow.postMessage(pyPending, "*"); pyPending = null; }
      }
      return;
    }
    if (d.kind === "status") { if (lang === "python") addLine("sys", d.text); return; }
    if (d.kind === "done") { if (d.id === runId && !d.visual && !errCount) showTab("console"); return; }
    if (d.id !== runId) return;
    addLine(d.level, d.text);
    if (d.level === "error") showTab("console");
  });

  /* ----- Language switching ----- */
  function park(){        // stop whatever the current language is running before leaving it
    if (lang === "javascript") stopJs();
    else if (pyFrame) {
      try { pyFrame.contentWindow.postMessage({ devportalHalt: true }, "*"); } catch(e){}
      pyFrame.style.display = "none"; pyPending = null; runId++; running = false;
    }
  }
  function loadSaved(){
    const savedCode = store.get(lkey("code"));
    sel.value = L().def;
    setCode(savedCode || L().examples[L().def], savedCode ? (store.get(lkey("fname")) || "script" + L().ext) : slug(L().def));
  }
  function setLang(next, keepEditor){
    if (next === lang) return;
    park();
    lang = next;
    store.set("devportal.lang", lang);
    document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
    buildExamples();
    if (!keepEditor) loadSaved();
  }
  document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    if (b.dataset.lang !== lang) { setLang(b.dataset.lang); run(); }
  });

  $("run").onclick = run;
  $("stop").onclick = () => { if (lang === "python") stopPython(); else stopJs(); addLine("sys", "■ stopped"); };
  sel.onchange = () => { setCode(L().examples[sel.value], slug(sel.value)); run(); };
  $("reset").onclick = () => { setCode(L().examples[sel.value], slug(sel.value)); toast("Reset to “" + sel.value + "”"); };

  /* ───────── Themes + animated backgrounds ───────── */
  const fxc = $("bg"), fx = fxc.getContext("2d");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let fxRaf = 0, fxKind = null, fxS = {};
  const FX_THEMES = { matrix: 1, jarvis: 1, heaven: 1 };

  const draw = {
    matrix(){
      const w = fxc.width, h = fxc.height;
      fx.fillStyle = "rgba(0,0,0,.1)"; fx.fillRect(0, 0, w, h);
      fx.font = "16px monospace";
      const chars = "アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789";
      fxS.tick = (fxS.tick || 0) + 1;
      if (fxS.tick % 2) return;
      fxS.drops.forEach((d, i) => {
        const ch = chars[Math.random() * chars.length | 0];
        fx.fillStyle = "#00ff41"; fx.fillText(chars[Math.random() * chars.length | 0], i * 16, (d - 1) * 16);
        fx.fillStyle = "#d2ffdc"; fx.fillText(ch, i * 16, d * 16);
        fxS.drops[i] = (d * 16 > h && Math.random() > .975) ? 0 : d + 1;
      });
    },
    jarvis(t){
      const w = fxc.width, h = fxc.height, cx = w / 2, cy = h / 2;
      fx.clearRect(0, 0, w, h);
      fx.strokeStyle = "rgba(0,229,255,.07)"; fx.lineWidth = 1;
      for (let x = 0; x < w; x += 48) { fx.beginPath(); fx.moveTo(x, 0); fx.lineTo(x, h); fx.stroke(); }
      for (let y = 0; y < h; y += 48) { fx.beginPath(); fx.moveTo(0, y); fx.lineTo(w, y); fx.stroke(); }
      const rings = [[110, 1, [70, 24], .5], [160, -1.4, [10, 14], .4], [215, .8, [120, 40], .35], [290, -.5, [30, 60], .25]];
      for (const [r, sp, dash, a] of rings) {
        fx.save(); fx.translate(cx, cy); fx.rotate(t * sp * .35);
        fx.strokeStyle = "rgba(0,229,255," + a + ")"; fx.lineWidth = 2; fx.setLineDash(dash);
        fx.beginPath(); fx.arc(0, 0, r, 0, 6.283); fx.stroke(); fx.restore();
      }
      fx.save(); fx.translate(cx, cy); fx.rotate(-t * .12); fx.strokeStyle = "rgba(0,229,255,.35)"; fx.lineWidth = 1;
      for (let i = 0; i < 90; i++) { const a = i / 90 * 6.283, l = i % 5 ? 6 : 14; fx.beginPath();
        fx.moveTo(Math.cos(a) * 340, Math.sin(a) * 340); fx.lineTo(Math.cos(a) * (340 + l), Math.sin(a) * (340 + l)); fx.stroke(); }
      fx.restore();
      fx.save(); fx.translate(cx, cy); fx.rotate(t * .9);
      const g = fx.createLinearGradient(0, 0, 330, 0); g.addColorStop(0, "rgba(0,229,255,.35)"); g.addColorStop(1, "rgba(0,229,255,0)");
      fx.strokeStyle = g; fx.lineWidth = 2; fx.beginPath(); fx.moveTo(0, 0); fx.lineTo(330, 0); fx.stroke(); fx.restore();
      fx.fillStyle = "rgba(0,229,255,.05)"; fx.fillRect(0, (t * 90) % h, w, 3);
    },
    heaven(t){
      const w = fxc.width, h = fxc.height;
      fx.clearRect(0, 0, w, h);
      for (let i = 0; i < 6; i++) {            // rays of light
        fx.save(); fx.translate(w * .5, -40); fx.rotate(-.55 + i * .22 + Math.sin(t * .15 + i) * .05);
        const g = fx.createLinearGradient(0, 0, 0, h * 1.2);
        g.addColorStop(0, "rgba(255,214,102,.30)"); g.addColorStop(1, "rgba(255,214,102,0)");
        fx.fillStyle = g; fx.beginPath(); fx.moveTo(0, 0); fx.lineTo(-70, h * 1.2); fx.lineTo(70, h * 1.2); fx.closePath(); fx.fill();
        fx.restore();
      }
      for (const c of fxS.clouds) {            // drifting clouds
        c.x += c.v; if (c.x - c.r > w) c.x = -c.r;
        const g = fx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
        g.addColorStop(0, "rgba(255,255,255,.55)"); g.addColorStop(1, "rgba(255,255,255,0)");
        fx.fillStyle = g; fx.beginPath(); fx.arc(c.x, c.y, c.r, 0, 6.283); fx.fill();
      }
      for (const s of fxS.stars) {             // golden sparkles
        s.y -= s.v / 60; if (s.y < -.02) s.y = 1.02;
        const a = .3 + .7 * Math.abs(Math.sin(t * 1.5 + s.p)), x = s.x * w, y = s.y * h, r = s.r * (.6 + a * .6);
        fx.strokeStyle = "rgba(212,160,23," + a + ")"; fx.lineWidth = 1.2;
        fx.beginPath(); fx.moveTo(x - r * 2, y); fx.lineTo(x + r * 2, y); fx.moveTo(x, y - r * 2); fx.lineTo(x, y + r * 2); fx.stroke();
        fx.fillStyle = "rgba(255,226,130," + a + ")"; fx.beginPath(); fx.arc(x, y, r, 0, 6.283); fx.fill();
      }
    }
  };
  function startFx(kind){
    cancelAnimationFrame(fxRaf); fxKind = kind;
    fxc.width = innerWidth; fxc.height = innerHeight;
    fx.clearRect(0, 0, fxc.width, fxc.height);
    if (!FX_THEMES[kind]) { fxc.style.display = "none"; return; }
    fxc.style.display = "block";
    if (kind === "matrix") { fxS = { drops: Array.from({ length: Math.ceil(fxc.width / 16) }, () => -Math.random() * 60 | 0) }; fx.fillStyle = "#000"; fx.fillRect(0, 0, fxc.width, fxc.height); }
    if (kind === "heaven") fxS = {
      stars: Array.from({ length: 80 }, () => ({ x: Math.random(), y: Math.random(), r: 1 + Math.random() * 3, v: .02 + Math.random() * .06, p: Math.random() * 6.28 })),
      clouds: Array.from({ length: 7 }, () => ({ x: Math.random() * fxc.width, y: Math.random() * fxc.height, r: 120 + Math.random() * 180, v: .08 + Math.random() * .2 }))
    };
    const loop = ms => { draw[kind](ms / 1000); if (!reduceMotion) fxRaf = requestAnimationFrame(loop); };
    loop(0);
  }
  addEventListener("resize", () => { clearTimeout(startFx.t); startFx.t = setTimeout(() => startFx(fxKind), 200); });

  function applyTheme(name, rerun){
    document.documentElement.dataset.theme = name;
    themeSel.value = name;
    store.set("devportal.js.theme", name);
    startFx(name);
    if (rerun && running) run();     // so the preview's THEME colours update
  }
  themeSel.onchange = () => applyTheme(themeSel.value, true);

  /* ───────── Init ───────── */
  const savedTheme = store.get("devportal.js.theme");
  applyTheme(savedTheme && [...themeSel.options].some(o => o.value === savedTheme) ? savedTheme : "black", false);
  lang = store.get("devportal.lang") === "python" ? "python" : "javascript";
  document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  buildExamples();
  loadSaved();
  run();
})();
</script>
</body>
</html>
